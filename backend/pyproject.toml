[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai-backend"
version = "0.1.0"
description = "Multi-agent customer support operations copilot"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: database, RAG, MCP boundary, and Agent-node integration tests",
    "e2e: complete customer-to-agent-to-approval-to-tool business flows",
]

[tool.ruff]
line-length = 100
target-version = "py311"
