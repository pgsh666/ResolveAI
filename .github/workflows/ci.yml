name: ResolveAI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock
      - name: Audit pinned backend dependencies
        run: |
          python -m pip install pip-audit==2.10.0
          python -m pip_audit -r requirements.lock
      - name: Run unit, integration, and end-to-end tests
        run: python -m pytest -q
      - name: Run 120-case Agent evaluation
        run: python -m evaluation.run --fail-under 90
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-report
          path: |
            backend/evaluation/reports/v3-120/evaluation-latest.json
            backend/evaluation/reports/v3-120/evaluation-latest.md
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=low
      - name: Build frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build backend mcp worker frontend
