x-backend-build: &backend-build
  context: ./backend

x-private-env: &private-env
  - path: ./.env
    required: false
  - path: ./.env.auth
    required: false

x-backend-environment: &backend-environment
  APP_ENV: production
  AUTH_ENABLED: "true"
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  PUBLIC_DEPLOYMENT: ${PUBLIC_DEPLOYMENT:-false}
  AGENT_MODE: ${AGENT_MODE:-demo}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
  OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-gpt-5-nano}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
  DEEPSEEK_FAST_MODEL: ${DEEPSEEK_FAST_MODEL:-deepseek-flash}
  NONCRITICAL_MODEL_STAGES: ${NONCRITICAL_MODEL_STAGES:-triage,rewrite}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
  MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
  TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-5}
  TOOL_MAX_RETRIES: ${TOOL_MAX_RETRIES:-2}
  RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.15}
  QUALITY_MAX_REGENERATIONS: ${QUALITY_MAX_REGENERATIONS:-1}
  FAILURE_ESCALATION_THRESHOLD: ${FAILURE_ESCALATION_THRESHOLD:-2}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
  SEMANTIC_EMBEDDING_MODEL: ${SEMANTIC_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
  EMBEDDING_CACHE_DIR: /app/embedding-models
  SEMANTIC_RAG_MIN_SCORE: ${SEMANTIC_RAG_MIN_SCORE:-0.55}
  PROMPT_VERSION: resolveai-prompts-2026-10-12-v3
  MODEL_INPUT_COST_PER_MILLION_USD: ${MODEL_INPUT_COST_PER_MILLION_USD:-0}
  MODEL_OUTPUT_COST_PER_MILLION_USD: ${MODEL_OUTPUT_COST_PER_MILLION_USD:-0}
  FAST_MODEL_INPUT_COST_PER_MILLION_USD: ${FAST_MODEL_INPUT_COST_PER_MILLION_USD:-0}
  FAST_MODEL_OUTPUT_COST_PER_MILLION_USD: ${FAST_MODEL_OUTPUT_COST_PER_MILLION_USD:-0}
  MODEL_PRIMARY_MAX_OUTPUT_TOKENS: ${MODEL_PRIMARY_MAX_OUTPUT_TOKENS:-1600}
  MODEL_FAST_MAX_OUTPUT_TOKENS: ${MODEL_FAST_MAX_OUTPUT_TOKENS:-600}
  MODEL_MAX_CONTEXT_CHARS: ${MODEL_MAX_CONTEXT_CHARS:-12000}
  AGENT_MAX_CONVERSATION_MESSAGES: ${AGENT_MAX_CONVERSATION_MESSAGES:-8}
  AGENT_MAX_MESSAGE_CHARS: ${AGENT_MAX_MESSAGE_CHARS:-1200}
  RAG_MAX_DOCUMENTS: ${RAG_MAX_DOCUMENTS:-3}
  RAG_SNIPPET_CHARS: ${RAG_SNIPPET_CHARS:-240}
  RETRIEVAL_CACHE_ENABLED: ${RETRIEVAL_CACHE_ENABLED:-true}
  RETRIEVAL_CACHE_TTL_SECONDS: ${RETRIEVAL_CACHE_TTL_SECONDS:-300}
  PERFORMANCE_SAMPLE_WINDOW: ${PERFORMANCE_SAMPLE_WINDOW:-1000}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-240}
  MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-32}
  REQUEST_QUEUE_TIMEOUT_SECONDS: ${REQUEST_QUEUE_TIMEOUT_SECONDS:-2}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-resolveai-backend}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tracing:4318/v1/traces}
  OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-5}
  OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1}
  OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
  OTEL_UI_URL: ${OTEL_UI_URL:-http://localhost:16686}
  ASYNC_TASKS_ENABLED: ${ASYNC_TASKS_ENABLED:-true}
  REDIS_URL: redis://redis:6379/0
  TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-resolveai}
  TASK_DEFAULT_TIMEOUT_SECONDS: ${TASK_DEFAULT_TIMEOUT_SECONDS:-900}
  TASK_EVALUATION_TIMEOUT_SECONDS: ${TASK_EVALUATION_TIMEOUT_SECONDS:-1800}
  TASK_RESULT_TTL_SECONDS: ${TASK_RESULT_TTL_SECONDS:-86400}
  TASK_FAILURE_TTL_SECONDS: ${TASK_FAILURE_TTL_SECONDS:-86400}
  TASK_EVALUATION_OUTPUT_DIR: /app/evaluation/reports/tasks
  DATABASE_URL: postgresql+psycopg://resolveai:${POSTGRES_PASSWORD:-resolveai_dev_only}@db:5432/resolveai
  RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-0.2}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - resolveai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: resolveai
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveai_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - resolveai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai -d resolveai"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  tracing:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  init-db:
    build: *backend-build
    env_file: *private-env
    volumes:
      - ./.build/embedding-models:/app/embedding-models:ro
    environment:
      <<: *backend-environment
      MCP_ENABLED: "false"
    command: ["python", "-m", "scripts.init_database"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mcp:
    build: *backend-build
    env_file: *private-env
    environment:
      <<: *backend-environment
      MCP_SERVER_URL: http://127.0.0.1:8001/mcp
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8001"
      MCP_ENABLED: "false"
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck_mcp"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: *backend-build
    env_file: *private-env
    environment:
      <<: *backend-environment
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://mcp:8001/mcp
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - evaluation_reports:/app/evaluation/reports
      - ./.build/embedding-models:/app/embedding-models:ro
    depends_on:
      db:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
      tracing:
        condition: service_started
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: *backend-build
    env_file: *private-env
    environment:
      <<: *backend-environment
      OTEL_SERVICE_NAME: resolveai-worker
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://mcp:8001/mcp
    command: ["python", "-m", "app.tasks.worker"]
    volumes:
      - evaluation_reports:/app/evaluation/reports
      - ./.build/embedding-models:/app/embedding-models:ro
    depends_on:
      db:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
      redis:
        condition: service_healthy
      tracing:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck_worker"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  resolveai_data:
  resolveai_redis:
  evaluation_reports:
